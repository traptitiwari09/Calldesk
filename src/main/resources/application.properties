spring.application.name=App

# Loads application-local.properties on top of this file.
# That file holds the real credentials and is gitignored; if it is missing,
# Spring skips it silently and the app still starts.
spring.profiles.active=local


spring.datasource.url=jdbc:h2:file:./data/appdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true


twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}

# Optional: an API key pair is safer than the master token because it can be
# revoked on its own. Signature validation still needs the auth token above.
twilio.api-key-sid=${TWILIO_API_KEY_SID:}
twilio.api-key-secret=${TWILIO_API_KEY_SECRET:}

# The Twilio number you own, E.164. Both people see this as the caller ID.
twilio.from-number=${TWILIO_FROM_NUMBER:}

# Where Twilio can reach this app from the internet - your ngrok https URL, no
# trailing slash. Free ngrok changes this every restart, so expect to update it.
twilio.public-base-url=${APP_PUBLIC_BASE_URL:}

# Rejects webhook requests that are not signed by Twilio. Leave on.
twilio.validate-signature=${TWILIO_VALIDATE_SIGNATURE:true}

# Country code applied when someone types a number without one.
app.default-country-code=${APP_DEFAULT_COUNTRY_CODE:+1}
