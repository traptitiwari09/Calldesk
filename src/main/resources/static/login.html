<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Log in - CallDesk</title>
	<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="auth-wrap">
	<div class="auth-card">

		<div class="auth-head">
			<div class="brand-mark">&#9742;</div>
			<h1>Welcome back</h1>
			<p>Log in to reach your contacts</p>
		</div>

		<div class="msg" id="message" hidden></div>

		<form id="login-form" novalidate>
			<div class="field">
				<label for="email">Email</label>
				<input class="input" type="email" id="email" name="email"
				       placeholder="you@example.com" autocomplete="email" required>
			</div>

			<div class="field">
				<label for="password">Password</label>
				<input class="input" type="password" id="password" name="password"
				       placeholder="Your password" autocomplete="current-password" required>
			</div>

			<button class="btn btn-primary btn-block" type="submit" id="submit">Log in</button>
		</form>

		<div class="auth-foot">
			New here? <a href="/signup.html">Create an account</a>
		</div>

	</div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
